<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>va va va gina</title>
<style>
  :root{
    --fundo:#8db9dc;
    --card:#bcd4e9;
    --card-baixo:#dde9ea;
    --texto:#ffffff;
    --destaque:#ccdbd1;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--fundo);padding:20px;
    font-family:'Helvetica Neue',Arial,sans-serif;color:var(--texto);
  }
  .card{width:100%;max-width:420px;background:var(--card);border-radius:28px;overflow:hidden}

  .player{display:flex;gap:16px;padding:20px;align-items:flex-start}
  .capa{width:96px;height:96px;border-radius:18px;flex-shrink:0;
        background:#b9a59a center/cover no-repeat}
  .info{flex:1;min-width:0;padding-top:8px}
  .musica{font-size:17px;font-weight:500}
  .artista{font-size:16px;font-weight:300;opacity:.9;margin-top:2px}
  .progresso{height:1px;background:rgba(255,255,255,.5);margin-top:16px;position:relative}
  .progresso span{position:absolute;left:0;top:0;height:1px;width:18%;background:#fff}
  .tempo{display:flex;justify-content:space-between;font-size:13px;margin-top:8px;opacity:.9}
  .spotify{width:34px;height:34px;flex-shrink:0;margin:14px 6px 0 0}

  .painel{max-height:0;opacity:0;overflow:hidden;
          transition:max-height .5s ease,opacity .4s ease;padding:0 20px}
  .painel.aberto{max-height:1400px;opacity:1;padding:6px 20px 22px}
  .painel-conteudo{display:flex;gap:14px}
  .perfil{width:96px;flex-shrink:0;font-size:14px;line-height:1.35;opacity:.95;word-break:break-word}
  .coracao{width:40px;height:40px;border-radius:50%;background:#fff;
           display:flex;align-items:center;justify-content:center;margin-bottom:8px}
  .coracao svg{width:20px;height:20px;fill:var(--destaque)}
  .perfil .nome{display:inline-block;border-bottom:3px solid var(--destaque);padding-bottom:2px;margin-bottom:4px}
  .textos{flex:1;font-size:14px;line-height:1.45}
  .textos p{padding:4px 0;border-bottom:2px solid #fff}
  .textos b{font-weight:700;margin-right:4px}

  .galeria{display:flex;justify-content:center;gap:12px;padding:20px 16px;background:var(--card-baixo)}
  .thumb{width:calc((100% - 36px)/4);aspect-ratio:1;border-radius:16px;border:0;cursor:pointer;
         background:#a99 center/cover no-repeat;transition:transform .2s,box-shadow .2s;padding:0}
  .thumb:active{transform:scale(.94)}
  .thumb.ativa{box-shadow:0 0 0 3px #fff}
</style>
</head>
<body>

<div class="card">
  <div class="player">
    <div class="capa" id="capa"></div>
    <div class="info">
      <div class="musica" id="musica">Snow Angel</div>
      <div class="artista" id="artista">Reneé Rapp</div>
      <div class="progresso"><span></span></div>
      <div class="tempo"><span>0:21</span><span>3:04</span></div>
    </div>
    <svg class="spotify" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#fff"/>
      <g fill="none" stroke="#cfc9c0" stroke-linecap="round">
        <path d="M5.5 9.2c4.2-1.2 8.6-.9 12.4 1.2" stroke-width="2"/>
        <path d="M6.2 12.5c3.5-1 7-.7 10.2 1" stroke-width="1.7"/>
        <path d="M6.9 15.5c2.8-.8 5.4-.5 7.9.8" stroke-width="1.5"/></g></svg>
  </div>

  <div class="painel" id="painel">
    <div class="painel-conteudo">
      <div class="perfil">
        <div class="coracao"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 5 6.3 5c1.9 0 3.5 1 4.5 2.5h.4C12.2 6 13.8 5 15.7 5 19 5 21.100 8.3 21.600 11.700 19.500 16.400 12 21 12 21z"/></svg></div>
        <span class="nome" id="nome"></span><br>
        <span id="detalhe"></span>
      </div>
      <div class="textos" id="textos"></div>
    </div>
  </div>

  <div class="galeria" id="galeria"></div>
</div>

<script>
const CONFIG = {
  cores: {
    fundo:    "#8db9dc",
    card:     "#bcd4e9",
    cardBaixo:"#dde9ea",
    texto:    "#ffffff",
    destaque: "#ccdbd1"
  },

  capa: "imagens/capa.jpg",

  itens: [
    { img:"imagens/foto1.jpg", cor:"#d9b99b", titulo:"gina", detalhe:"@1997intokyo",
      textos:[["sobre","ela/dela, lésbica, br, nordestina, pt-br, taurina, isfp"],
              ["antes de seguir","only lilie! dou sdv, mas se eu não simpatizar com suas postagens, dou sb. falo sobre vivências do dia-a-dia, sobre o que estou consumindo no momento (filmes, séries, desenhos), faço posts de admiração a mulheres, falo palavrão, sou reclamona e hipócrita."]] },
    { img:"imagens/foto2.jpg", cor:"#b5483f", titulo:"não siga se", detalhe:"",
      textos:[["•","critérios básicos de dnfi"],
              ["•","anti das minhas favs"],
              ["•","faz parte de algum twt problemático"],
              ["•","shipper chato"],
              ["•","se não temos nenhum interesse em comum"],
              ["•","romantiza transtorno"]] },
    { img:"imagens/foto3.jpg", cor:"#c9a96e", titulo:"gostos", detalhe:"jogos, músicas, filmes & séries",
      textos:[["jogos","pubg, roblox, minecraft, my singing monsters, plato, qualquer um que eu consiga jogar!!"],
              ["música","lisa, chuu, njz, clairo, melanie martinez, beabadoobee, olivia rodrigo, sza, au/ra, adela."],
              ["filmes & séries","nerve (filme), the haunting of hill house (série), the haunting of bly manor (série), the vampire diaries (série), franquia de invocação do mal (filmes), scream queens (série), a vida sexual das universitárias (série), etc."],
              ["cartoons","studio ghibli, hora de aventura, the owl house, princesas disney, my little pony, equestria girls, harley quinn, etc."]] },
    { img:"imagens/foto4.jpg", cor:"#8a3a3a", titulo:"likes", detalhe:"e deslikes",
      textos:[["likes","lisa, gatos, filmes, séries, doce, lanches, arte, música, gastronomia, rpg, refrigerante, pistache, inde navarrette, emma roberts, mckenna grace, lily collins."],
              ["deslike","grosseria, gore, sangue, pressão, café, chá, insetos."]] }
  ]
};

const r = document.documentElement.style, c = CONFIG.cores;
r.setProperty('--fundo', c.fundo);
r.setProperty('--card', c.card);
r.setProperty('--card-baixo', c.cardBaixo);
r.setProperty('--texto', c.texto);
r.setProperty('--destaque', c.destaque);

const capa = document.getElementById('capa');
if (CONFIG.capa) capa.style.backgroundImage = `url(${CONFIG.capa})`;

const galeria = document.getElementById('galeria');
const painel  = document.getElementById('painel');
let atual = -1;

CONFIG.itens.forEach((item, i) => {
  const b = document.createElement('button');
  b.className = 'thumb';
  b.style.backgroundColor = item.cor;
  if (item.img) b.style.backgroundImage = `url(${item.img})`;
  b.setAttribute('aria-label', item.titulo);
  b.onclick = () => abrir(i);
  galeria.appendChild(b);
});

function abrir(i){
  const thumbs = galeria.children;
  if (atual === i){
    painel.classList.remove('aberto');
    thumbs[i].classList.remove('ativa');
    atual = -1; return;
  }
  const item = CONFIG.itens[i];
  document.getElementById('nome').textContent = item.titulo;
  document.getElementById('detalhe').textContent = item.detalhe;
  document.getElementById('textos').innerHTML =
    item.textos.map(t => `<p><b>${t[0]}</b>${t[1]}</p>`).join('');
  [...thumbs].forEach(t => t.classList.remove('ativa'));
  thumbs[i].classList.add('ativa');
  painel.classList.add('aberto');
  atual = i;
}
</script>
</body>
</html>
